<!doctype html>

<style>
  :root{--bg:#ffffff;--bg-alt:#faf7ff;--ink:#0f172a;--muted:#64748b;--accent:#673AB6;--accent-deep:#4c1d95;--line:#e5e7eb;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}

  .card{max-width:560px;text-align:center;}
  .code{font-size:96px;font-weight:800;color:var(--accent);line-height:1;margin:0 0 12px;}
  h1{font-size:28px;font-weight:700;margin:0 0 12px;}
  p{color:var(--muted);font-size:17px;line-height:1.6;margin:0 0 28px;}
  .actions a{display:inline-block;margin:6px;padding:12px 20px;border-radius:8px;font-weight:600;text-decoration:none;border:1px solid var(--line);color:var(--ink);}
  .actions a.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .actions a.primary:hover{background:var(--accent-deep);}
</style>
</head>
<body>
